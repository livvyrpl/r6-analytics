.mr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}.mr label{font-size:12px;margin:0}.mr .fi{height:38px;padding:0 8px;margin-top:4px}.mpn{font-weight:600;font-size:15px;overflow-wrap:anywhere}

.stv{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}.stc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stc.one{grid-template-columns:minmax(0,1fr)}@media(max-width:640px){.stc{grid-template-columns:minmax(0,1fr)}}.stf{display:block;width:100%;aspect-ratio:16/10;min-height:220px;border:1px solid var(--bd);border-radius:12px;background:var(--cd)}

.vod{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1a73e8;color:#fff;font-size:12px;font-weight:600;text-decoration:none}.vod:hover{background:#3b8bf0}

<body>
<div id="app"></div><div id="toast" role="status"></div><dialog id="dlg"></dialog><button id="upd" data-a="updnow" hidden>New update available. Refresh</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script id="app-js">
const SUPABASE_URL='https://hyfycayfadqjhxucpfnm.supabase.co',SUPABASE_KEY='sb_publishable_91fUHDwka-sQOMN5A8J8CQ_KyfQVsc7';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const R={coach:'Coach',assistant_coach:'Assistant Coach',analyst:'Analyst',player:'Player'},ALL=Object.keys(R);
const REG=['North America','South America','Europe','Asia Pacific'],COL=['#e07cc0','#7cc0e0','#e0c07c','#9ae07c','#c07ce0','#e07c7c','#7ce0c0','#ece8f0'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s),ico=p=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
let me=null,teams=[],mem={},allMem=[],profs=[],invs=[],cur=null,view='dash',viewing=false,fm=null,sel=null,mode='in',scr=null,sch=null,pl=null,ros=null,an=null,stra=null,cov=null,sco=null,rost=null,sdirty=false;
const staff=()=>me&&['owner','admin'].includes(me.site_role),owner=()=>me&&me.site_role==='owner';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
const logoOk=u=>!!u&&!/liquipedia\.net/i.test(u);
const tile=(t,s=36)=>{const c=esc(t?.color||'#e07cc0');return `<span class="lt" style="--s:${s}px;color:${c};border-color:${c};background:${c}22">${logoOk(t?.logo_url)?`<img src="${esc(t.logo_url)}" alt="">`:esc((t?.name||'?').slice(0,2).toUpperCase())}</span>`};
async function load(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){me=null;view='dash';viewing=false;scr=null;sch=null;pl=null;ros=null;an=null;stra=null;cov=null;sco=null;rost=null;sdirty=false;return render()}
 const uid=session.user.id;
 me=(await sb.from('profiles').select('*').eq('id',uid).maybeSingle()).data;
 if(!me||me.suspended)return render();
 const[t,m]=await Promise.all([sb.from('teams').select('*').order('name'),sb.from('team_members').select('*')]);
 teams=t.data||[];allMem=m.data||[];mem={};allMem.filter(x=>x.user_id===uid).forEach(x=>mem[x.team_id]=x.roles);
 if(staff()){profs=(await sb.from('profiles').select('*').order('email')).data||[];invs=(await sb.from('invites').select('*')).data||[]}
 cur=teams.find(x=>cur&&x.id===cur.id)||teams.find(x=>mem[x.id])||(staff()?null:teams[0])||null;
 render();
}
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=c=>{const[r,g,b]=c.map(x=>{x/=255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
const TEAM_VIEWS=new Set(['dash','scrims','schedule','player','roster','analyst','strats','cover','tset']);
function applyAccent(){
 // pink unless a team is attached: an opponent's page, and a game opened from it, take that opponent's color; the selected team's own pages take its color
 const seen=view==='sc'&&sco?(sco.page==='opp'?sco.oppId:sco.page==='match'&&sco.mBack?.page==='opp'?sco.mBack.oppId:null):null,opp=seen&&sco.teams?.find(t=>t.id===seen);
 const st=document.documentElement.style,h=!me?null:view==='sc'?normHex(opp?.color||''):cur&&TEAM_VIEWS.has(view)?normHex(cur.color):null;
 if(!h){['--pk','--pk-rgb','--pk-lt'].forEach(v=>st.removeProperty(v));return}
 let c=hexRgb(h);const bg=lum(hexRgb('#131118'));
 for(let i=0;i<12&&(lum(c)+.05)/(bg+.05)<4.5;i++)c=c.map(x=>Math.round(x+(255-x)*.12));
 st.setProperty('--pk','rgb('+c+')');st.setProperty('--pk-rgb',c.join(','));st.setProperty('--pk-lt','rgb('+c.map(x=>Math.round(x+(255-x)*.55))+')');
}
function render(){
 applyAccent();
 killCharts();
 const a=$('#app');
 if(!me)return a.innerHTML=loginV();
 if(me.suspended)return a.innerHTML=`<div class="login"><div class="cd"><p>This account is suspended. Ask the owner for help.</p><button class="no" data-a="out">Sign out</button></div></div>`;
 const mine=teams.filter(t=>mem[t.id]);
 a.innerHTML=`<header><button class="hm" data-a="go" data-v="dash" aria-label="Liv Analytics, go to dashboard"><img src="logo.png" alt=""><span class="brand serif">Liv Analytics</span></button><span class="sp"></span>
 ${staff()?`<button class="tb" data-a="go" data-v="admin">Admin</button>`:''}
 ${mine.length>1?`<select class="tb" data-c="sw" aria-label="Switch team">${mine.map(t=>`<option value="${t.id}"${cur&&t.id===cur.id?' selected':''}>${esc(t.name)}</option>`).join('')}</select>`:''}
 <button class="tb" data-a="go" data-v="dash">Dashboard</button><button class="tb" data-a="settings">Settings</button><button class="tb" data-a="profile">Profile</button></header>
 ${viewing&&view==='dash'&&cur?`<div class="bar"><span>Viewing ${esc(cur.name)} as ${me.site_role}</span><button class="no" data-a="go" data-v="teamsV">Back to teams</button></div>`:''}
 <main>${({dash:dashV,admin:adminV,teamsV,users:usersV,create:createV,scrims:scrimsV,schedule:scheduleV,player:playerV,roster:rosterV,analyst:analystV,strats:stratsV,cover:coverV,sc:scoutV,tset:teamSetV})[view]()}</main><footer>Map and operator images © Ubisoft. Some data from Liquipedia, CC-BY-SA. Liv Analytics is not affiliated with Ubisoft.</footer>`;
 if(view==='analyst')drawCharts();
 if(view==='sc')scDraw();
}
function loginV(){return `<div class="login"><img src="logo.png" alt="Liv Analytics"><form class="cd" data-s="auth">
 <div><label for="em">Email</label><input id="em" class="fi" type="email" required autocomplete="email"></div>
 <div><label for="pw">Password</label><input id="pw" class="fi" type="password" required minlength="8" autocomplete="${mode==='in'?'current-password':'new-password'}"></div>
 <button class="go" style="height:48px">${mode==='in'?'Sign in':'Create account'}</button>
 <button type="button" class="no" style="border:0" data-a="mode">${mode==='in'?'Invited? Create your account':'I already have an account'}</button></form>
 <p class="mu">Access is by invitation. Ask your team owner to add you.</p></div>`}
const HUBS=[['Scouting',['coach','assistant_coach','analyst'],'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',[['Scouting','tracked opponents by region and league','sct'],['Match Library','all teams, every game','slm'],['Round Library','all teams, every round','slr'],['Vetoes','bans and picks per team','slv'],['Export to Sheets','pick league and teams, then export','sx']]],
['Coach Deck',['coach','assistant_coach'],'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',[['Overview','everything for coaches','cover'],['Scrims','results, bans, notes per player','scrims'],['Schedule','scrims, gamedays, off days','schedule'],['Strats','open slides in the site','strats'],['Player Hub','stats, journals, off days for every player','phub'],['Team Settings','name, region, league, color, logo','tset']]],
['Analyst Deck',['analyst','coach','assistant_coach'],'<path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"/>',[['Overview','analyst summary','aover'],['Scrims','results, bans, notes per player','scrims'],['Schedule','scrims, gamedays, off days','schedule'],['Strats','open slides in the site','strats'],['Stats','your team and opponents','astats'],['Import','replays and scrims','aimport'],['Parse','drop in .rec replay files','aparse']]],
['Player Deck',['player'],'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>',[['Overview','your week at a glance','pover'],['My Schedule','team schedule, add off days','pmysch'],['Journal','goals with deadlines','pjournal'],['My Stats','KOST, K/D, operators','pstats'],['Strats','open slides in the site','strats']]]];
function dashV(){
 if(!cur)return `<div class="cd"><h2 class="serif" style="font-size:28px">No team yet</h2><p class="mu">${staff()?'Create a team in Admin, or open one from the Teams list.':'Ask the owner to add you to a team.'}</p></div>`;
 const roles=staff()?ALL:(mem[cur.id]||[]);
 const badge=[...(staff()?[me.site_role]:[]),...(mem[cur.id]||[]).map(r=>R[r])].join(', '),seen=new Set();
 return `<div class="row wrap" style="margin-bottom:24px;gap:14px">${tile(cur,48)}<h1 class="serif" style="font-size:34px;color:var(--pk)">${esc(cur.name)}</h1><span class="badge">${esc(badge)}</span></div>`+

function readBlocks(){

 document.querySelectorAll('.mapd').forEach(el=>{
  const sel=el.querySelector('[data-c=mapsel]'),map=sel?sel.value:el.dataset.map,val=k=>el.querySelector(`[data-f=${k}]`).value.trim();
  const v={score:null,split:null,started_on:val('started_on')||null};
  BANS.forEach(b=>v[b[0]]=[...el.querySelectorAll(`[data-b=${b[0]}]`)].map(i=>i.value.trim()).filter(Boolean));
  const any=!!(val('score')||val('split')||v.started_on||BANS.some(b=>v[b[0]].length));
  if(!map){if(any)err=err||'Choose a map for each entry';return}
  if(rows.some(r=>norm(r.map)===norm(map))){err=err||map+' is added twice';return}
  const sc=parseScore(val('score')),sp=parseScore(val('split'));
  if(val('score')&&!sc)err=err||`Enter the ${map} score like 7-5`;
  if(val('split')&&!sp)err=err||`Enter the ${map} split like 4-2`;
  if(sc&&sp&&(sp.a>sc.a||sp.b>sc.b))err=err||`The ${map} split cannot be more than its score`;
  if(sp&&sp.a+sp.b!==6)err=err||`The ${map} split is the score after 6 rounds, so it should add up to 6`;
  if(sc)v.score=fmtPair(sc);if(sp)v.split=fmtPair(sp);
  rows.push({map,any,v});
 });
 return{rows,err};
}

 if(sc.length){const text=rows.length===1?fmtPair(sc[0]):sc.filter(p=>p.a>p.b).length+'-'+sc.filter(p=>p.a<p.b).length;if(text!==scrim.score){const r=await sb.from('scrims').update({score:text}).eq('id',sid).select().single();if(r.error)return sErr(r.error);scrim.score=text}}
 return '';
}
