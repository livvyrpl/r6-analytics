  const sel=el.querySelector('[data-c=mapsel]'),map=sel?sel.value:el.dataset.map,val=k=>el.querySelector(`[data-f=${k}]`).value.trim();
  const v={score:null,split:null,started_on:val('started_on')||null};
  BANS.forEach(b=>v[b[0]]=[...el.querySelectorAll(`[data-b=${b[0]}]`)].map(i=>i.value.trim()).filter(Boolean));
  const any=!!(val('score')||val('split')||v.started_on||BANS.some(b=>v[b[0]].length));
  if(!map){if(any)err=err||'Choose a map for each entry';return}
  if(rows.some(r=>norm(r.map)===norm(map))){err=err||map+' is added twice';return}
  const sc=parseScore(val('score')),sp=parseScore(val('split'));
  if(val('score')&&!sc)err=err||`Enter the ${map} score like 7-5`;
  if(val('split')&&!sp)err=err||`Enter the ${map} split like 4-2`;
  if(sc&&sp&&(sp.a>sc.a||sp.b>sc.b))err=err||`The ${map} split cannot be more than its score`;
  if(sc)v.score=fmtPair(sc);if(sp)v.split=fmtPair(sp);
  rows.push({map,any,v});
 });
 return{rows,err};
}
async function saveMapRows(sid,tid,rows,prev,scrim){
 const up=rows.filter(r=>r.any&&(()=>{const o=prev.find(x=>x.map===r.map);return !o||Object.keys(r.v).some(k=>JSON.stringify(r.v[k])!==JSON.stringify(o[k]??(Array.isArray(r.v[k])?[]:null)))})()).map(r=>({scrim_id:sid,team_id:tid,map:r.map,...r.v}));
 const del=prev.filter(o=>!rows.some(r=>r.any&&r.map===o.map)).map(o=>o.map);
 if(up.length){const r=await sb.from('scrim_map_results').upsert(up);if(r.error)return aErr(r.error)}
 if(del.length){const r=await sb.from('scrim_map_results').delete().eq('scrim_id',sid).in('map',del);if(r.error)return aErr(r.error)}
 const m=await sb.from('scrim_map_results').select('*').eq('scrim_id',sid);if(m.error)return aErr(m.error);
 scr.mr=m.data||[];
 const sc=scr.mr.filter(x=>rows.some(r=>r.map===x.map)).map(x=>parseScore(x.score)).filter(Boolean);
 if(sc.length){const text=rows.length===1?fmtPair(sc[0]):sc.filter(p=>p.a>p.b).length+'-'+sc.filter(p=>p.a<p.b).length;if(text!==scrim.score){const r=await sb.from('scrims').update({score:text}).eq('id',sid).select().single();if(r.error)return sErr(r.error);scrim.score=text}}
 return '';
}

const pageSig=d=>['#app-css','#app-js'].map(s=>d.querySelector(s)?.textContent).join('\n');
async function checkUpdate(){
 if(document.hidden||!$('#upd').hidden)return;
 try{const r=await fetch(location.pathname,{cache:'no-store'});if(!r.ok)return;
  const n=new DOMParser().parseFromString(await r.text(),'text/html');
  if(!n.querySelector('#app-js')||pageSig(n)===pageSig(document))return;
  $('#upd').hidden=false;document.body.classList.add('upd')}catch{}
}
setInterval(checkUpdate,12e4);setTimeout(checkUpdate,5e3);document.addEventListener('visibilitychange',checkUpdate);
