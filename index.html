function walkEntry(en,out){
 if(en.isFile)return new Promise(ok=>en.file(f=>{out.push({file:f,name:f.name,path:(en.fullPath||f.name).replace(/^\//,''),size:f.size});ok()},()=>ok()));
 if(!en.isDirectory)return Promise.resolve();
 const rd=en.createReader();
 const next=()=>new Promise(ok=>rd.readEntries(async es=>{if(!es.length)return ok();await Promise.all(es.map(x=>walkEntry(x,out)));await next();ok()},()=>ok()));
 return next();
}

async function lpTeamWork(l,t,from,rosters,tag=''){
 const years=[];if(from)for(let y=+from.slice(0,4);y<=new Date().getFullYear();y++)years.push(String(y));
 let name=t.source_ids?.liquipedia||t.name,aliases=[],ok=false;
 await lpStep(l,tag+`Finding ${t.name} on Liquipedia`,async()=>{try{const r=await lpCall({action:'find',part:'team',name,opp_id:t.id});name=r.name;aliases=r.aliases||[];ok=true}catch(e){throw new Error(/no page called/i.test(e.message)?`Liquipedia has no page called ${name}. Add this team's Liquipedia link in Settings.`:e.message)}},t.name);
 if(!ok||l.stop)return;
 const found=new Set();
 for(const part of ['results','matches'])await lpStep(l,tag+'Finding every event they played in, about 30 seconds',async()=>{(await lpCall({action:'find',part,name})).titles.forEach(x=>found.add(x))},t.name+' event list');
 const skip=/Showmatch|Global Standings|\/Results|\/Statistics|\/Transfers/i,recent=[...found].filter(x=>(!from||years.some(y=>x.includes(y)))&&!skip.test(x)).sort((a,b)=>a.localeCompare(b)),roots=recent.filter(x=>!recent.some(y=>y!==x&&x.startsWith(y+'/')));
 const pages=new Set(recent);l.prog.n+=roots.length;lpDraw();
 for(const x of roots)await lpStep(l,tag+'Listing '+x,async()=>{(await lpCall({action:'resolve',url:'https://liquipedia.net/rainbowsix/'+encodeURI(x.replace(/ /g,'_'))})).pages.forEach(p=>{if(!skip.test(p.title))pages.add(p.title)})},x);
 l.sum.events+=pages.size;l.prog.n+=pages.size;lpDraw();
 const before=l.sum.matches+l.sum.skipped;
 for(const p of pages)await lpStep(l,tag+'Reading '+p,async()=>{const r=await lpCall({action:'pull',page:p,teams:[name,...aliases],canon:name,from:from||undefined});l.sum.matches+=r.matches;l.sum.vetoes+=r.vetoes;l.sum.skipped+=r.skipped},p);
 if(rosters&&!(t.players||[]).length){l.prog.n++;await lpStep(l,tag+'Getting roster, about 30 seconds',()=>lpCall({action:'roster',name}),t.name+' roster')}
 if(!l.stop&&l.sum.matches+l.sum.skipped===before)l.fails.push(`No games in this date range were found for ${t.name} on Liquipedia.`);
}

 if(c==='mapsel'){const box=e.target.closest('.mapd');box.dataset.map=e.target.value;box.querySelector('.mph').innerHTML=mapPhoto(e.target.value)}

 if(c==='rlink'){const row=rost.list.find(x=>x.id===e.target.dataset.id),v=e.target.value||null;sb.from('team_roster').update({linked_user_id:v}).eq('id',row.id).select().single().then(r=>{if(r.error){e.target.value=row.linked_user_id||'';return toast('That link could not be saved. The name can only link to a player on this team.')}row.linked_user_id=v;toast('Roster saved')})}
 if(c==='lpev'||c==='lpteam'){const set=c==='lpev'?sco.lp.on:sco.lp.tOn;e.target.checked?set.add(e.target.dataset.id):set.delete(e.target.dataset.id);render()}

 if(c==='sfo'){const w=$('#sfonw');if(w)w.hidden=e.target.value!=='__new';if(e.target.value==='__new')$('#sfon')?.focus()}

 if(c==='xlib'){e.target.checked?sco.x.libs.add(e.target.dataset.k):sco.x.libs.delete(e.target.dataset.k)}
 if(c==='sccsv'&&e.target.files[0]){const f=e.target.files[0],k=sco.kind;if(f.size>5242880){sco.imp={error:'This file is larger than 5 MB. Split it into smaller files.'};render();return}f.text().then(t=>{sco.imp={...csvPreview(k,t),file:f.name};render()},()=>{sco.imp={error:'This file could not be read.'};render()})}
 if(c==='stf'){stra[e.target.dataset.k]=e.target.value;const l=$('#stl');if(l)l.innerHTML=stratCards()}

 if(c==='rcteam'){if(e.target.value)an.rpick[e.target.dataset.n]=e.target.value;recPaint();recAutoAll()}
 if(c==='rcname'){recRc(e.target.dataset.k).names[e.target.dataset.i]=e.target.value;recPaint();recAutoAll()}

 if(c==='schfor'){sch.forUser=e.target.value;render()}

document.addEventListener('submit',async e=>{if(e.target.dataset.s==='scrim'){e.preventDefault();return saveScrim(e.target)}if(e.target.dataset.s==='sched'){e.preventDefault();return saveSch(e.target)}if(e.target.dataset.s==='goal'){e.preventDefault();return saveGoal(e.target)}if(e.target.dataset.s==='gnote'){e.preventDefault();return saveNote(e.target)}if(e.target.dataset.s==='strat'){e.preventDefault();return saveStrat(e.target)}if(e.target.dataset.s==='sopp'){e.preventDefault();return saveSo(e.target)}if(e.target.dataset.s==='smatch'){e.preventDefault();return saveMatch(e.target)}if(e.target.dataset.s==='srate'){e.preventDefault();return saveRate(e.target)}if(e.target.dataset.s==='lplink'){e.preventDefault();const u=$('#lpu').value.trim();if(!/^https?:\/\/(www\.)?liquipedia\.net\/rainbowsix\/\S+/i.test(u)){sco.lp.url=u;sco.lp.err='Paste a Liquipedia Rainbow Six link, like https://liquipedia.net/rainbowsix/North_America_League/2026/Stage_2';render();return}return lpResolve(u)}if(e.target.dataset.s==='tset'){e.preventDefault();return saveTeamSet(e.target)}if(e.target.dataset.s==='rost'){e.preventDefault();return addRoster(e.target)}if(e.target.dataset.s!=='auth')return;e.preventDefault();
 const email=$('#em').value.trim(),password=$('#pw').value;
 if(mode==='in'){const{error}=await sb.auth.signInWithPassword({email,password});if(error)toast('Wrong email or password')}
 else{const{data,error}=await sb.auth.signUp({email,password});if(error)toast(/invited|Database error/i.test(error.message)?'This email has not been invited yet.':error.message);else if(!data.session)toast('Check your email to confirm, then sign in')}});

document.addEventListener('dragleave',e=>{if(view==='analyst'&&!e.relatedTarget)$('#dz')?.classList.remove('on')});
document.addEventListener('drop',async e=>{if(view!=='analyst'||!['import','parse'].includes(an?.page))return;e.preventDefault();$('#dz')?.classList.remove('on');if(!e.target.closest?.('#dz'))return;
 const dt=e.dataTransfer,es=[...(dt.items||[])].map(i=>i.webkitGetAsEntry?.()).filter(Boolean),out=[];
 if(es.length)await Promise.all(es.map(x=>walkEntry(x,out)));else [...(dt.files||[])].forEach(f=>out.push({file:f,name:f.name,path:f.name,size:f.size}));
 addRecs(out)});
document.addEventListener('error',e=>{if(e.target.matches?.('img.ph,img.opi'))e.target.classList.add('gone')},true);
const pageSig=d=>['#app-css','#app-js'].map(s=>d.querySelector(s)?.textContent).join('\n');
async function checkUpdate(){
 if(document.hidden||!$('#upd').hidden)return;
 try{const r=await fetch(location.pathname,{cache:'no-store'});if(!r.ok)return;
  const n=new DOMParser().parseFromString(await r.text(),'text/html');
  if(!n.querySelector('#app-js')||pageSig(n)===pageSig(document))return;
  $('#upd').hidden=false;document.body.classList.add('upd')}catch{}
}
setInterval(checkUpdate,12e4);setTimeout(checkUpdate,5e3);document.addEventListener('visibilitychange',checkUpdate);
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'&&me&&s?.user?.id===me.id)return;if(['SIGNED_IN','SIGNED_OUT','INITIAL_SESSION'].includes(ev))setTimeout(load,0)});
