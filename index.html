<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liv Analytics</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--pk:#e07cc0;--bg:#0b0a0e;--cd:#131118;--bd:#231f2b;--bd2:#2a2532;--tx:#ece8f0;--mu:#9a93a6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(224,124,192,.09),transparent 70%),var(--bg);color:var(--tx);font:400 14px Inter,sans-serif;min-height:100vh}
h1,h2,h3,p{margin:0}button,input,select,textarea{font:inherit}
.serif{font-family:'Cormorant Garamond',serif;font-weight:600}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid #1d1923;flex-wrap:wrap}
header img{height:52px}header .brand{font-size:26px;letter-spacing:.02em}.sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:28px 24px}
.tb{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--bd2);background:var(--cd);color:var(--pk);font-weight:500;cursor:pointer}
.tb:hover,.no:hover,.ch:hover{border-color:var(--pk)}
.go{height:42px;padding:0 20px;border:0;border-radius:10px;background:var(--pk);color:#1a0b15;font-weight:600;cursor:pointer}.go:hover{background:#ea90cd;box-shadow:0 0 28px rgba(224,124,192,.35)}

.ch{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--bd2);background:#0f0d13;color:#cfc8d6;font-weight:500;font-size:13px;cursor:pointer}
.ch[aria-pressed=true]{border-color:var(--pk);background:rgba(224,124,192,.16);color:#f3c2e3}
.fi{width:100%;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--bd2);background:#0f0d13;color:var(--tx)}
.fi:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--pk);outline-offset:2px}
.ta{display:block;height:auto;min-height:110px;padding:10px 14px;line-height:1.5;resize:vertical}
input[type=date],input[type=time]{color-scheme:dark}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.facts b{display:block;margin-top:2px;font-weight:500;overflow-wrap:anywhere}

.cd{padding:22px;border-radius:16px;background:var(--cd);border:1px solid var(--bd);display:flex;flex-direction:column;gap:16px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{display:flex;gap:14px;align-items:center;padding:18px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);color:var(--tx);text-align:left;cursor:pointer;width:100%;transition:all .15s}
.c:hover{border-color:var(--pk);background:linear-gradient(135deg,rgba(224,124,192,.14),var(--cd) 70%);box-shadow:0 0 30px rgba(224,124,192,.18)}
.ic{width:42px;height:42px;border-radius:10px;border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;color:var(--pk);flex:none}
.c b{display:block;font-weight:600;font-size:15px}.c small{display:block;margin-top:3px;font-size:12.5px;color:var(--mu)}
.soon{margin-left:auto;font-size:11px;color:var(--mu);border:1px solid var(--bd2);border-radius:999px;padding:2px 8px}
h2.hh{font-size:15px;font-weight:600;margin:26px 0 12px}h2.hh:first-of-type{margin-top:0}
.lt{width:var(--s,36px);height:var(--s,36px);flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;overflow:hidden;border:1px solid}
.lt img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:12px}.wrap{flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}
.u{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid transparent;background:none;color:var(--tx);width:100%;text-align:left;cursor:pointer}
.u:hover{background:rgba(224,124,192,.08);border-color:#3a2a35}.u[aria-current=true]{background:rgba(224,124,192,.14);border-color:var(--pk)}
.av{width:38px;height:38px;border-radius:50%;background:#2a1d26;color:#f3c2e3;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.tr{padding:14px;border-radius:12px;border:1px solid var(--bd);background:#0f0d13;display:flex;flex-direction:column;gap:10px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tx)}
.two{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}.two2{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;align-items:start}
@media(max-width:820px){.two,.two2{grid-template-columns:1fr}}
.bar{background:rgba(224,124,192,.16);border-bottom:1px solid var(--pk);color:#f3c2e3;padding:10px 24px;display:flex;gap:12px;align-items:center}
.badge{padding:4px 10px;border-radius:999px;border:1px solid #3a2a35;color:var(--pk);font-size:12px;font-weight:600}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:30px}
.login img{width:280px;max-width:80%}.login .cd{width:100%;max-width:400px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1923;border:1px solid var(--pk);padding:12px 18px;border-radius:10px;display:none;z-index:9}
dialog{background:var(--cd);color:var(--tx);border:1px solid var(--bd2);border-radius:16px;padding:24px;width:min(420px,92vw)}dialog::backdrop{background:rgba(0,0,0,.6)}
[hidden]{display:none!important}
</style>
</head>
<body>

<script>
const SUPABASE_URL='https://hyfycayfadqjhxucpfnm.supabase.co',SUPABASE_KEY='sb_publishable_91fUHDwka-sQOMN5A8J8CQ_KyfQVsc7';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

 if(staff()){profs=(await sb.from('profiles').select('*').order('email')).data||[];invs=(await sb.from('invites').select('*')).data||[]}
 cur=teams.find(x=>cur&&x.id===cur.id)||teams.find(x=>mem[x.id])||(staff()?null:teams[0])||null;
 render();
}
function render(){
 const a=$('#app');
 if(!me)return a.innerHTML=loginV();
 if(me.suspended)return a.innerHTML=`<div class="login"><div class="cd"><p>This account is suspended. Ask the owner for help.</p><button class="no" data-a="out">Sign out</button></div></div>`;

 ${mine.length>1?`<select class="tb" data-c="sw" aria-label="Switch team">${mine.map(t=>`<option value="${t.id}"${cur&&t.id===cur.id?' selected':''}>${esc(t.name)}</option>`).join('')}</select>`:''}
 <button class="tb" data-a="go" data-v="dash">Dashboard</button><button class="tb" data-a="settings">Settings</button><button class="tb" data-a="profile">Profile</button></header>
 ${viewing&&view==='dash'&&cur?`<div class="bar"><span>Viewing ${esc(cur.name)} as ${me.site_role}</span><button class="no" data-a="go" data-v="teamsV">Back to teams</button></div>`:''}
 <main>${({dash:dashV,admin:adminV,teamsV,users:usersV,create:createV,scrims:scrimsV,schedule:scheduleV})[view]()}</main>`;
}
function loginV(){return `<div class="login"><img src="logo.png" alt="Liv Analytics"><form class="cd" data-s="auth">
 <div><label for="em">Email</label><input id="em" class="fi" type="email" required autocomplete="email"></div>
 <div><label for="pw">Password</label><input id="pw" class="fi" type="password" required minlength="8" autocomplete="${mode==='in'?'current-password':'new-password'}"></div>
 <button class="go" style="height:48px">${mode==='in'?'Sign in':'Create account'}</button>
 <button type="button" class="no" style="border:0" data-a="mode">${mode==='in'?'Invited? Create your account':'I already have an account'}</button></form>
 <p class="mu">Access is by invitation. Ask your team owner to add you.</p></div>`}
const HUBS=[['Scouting',['coach','analyst'],'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',[['Scouting','teams by region and league'],['Match Library','all teams, every game'],['Round Library','all teams, every round'],['Vetoes','bans and picks per team'],['Export to Sheets','pick league and teams, then copy']]],
['Coaches hub',['coach','assistant_coach'],'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',[['Overview','everything for coaches'],['Scrims','results, bans, notes per player','scrims'],['Schedule','scrims, gamedays, off days','schedule'],['Strats','open slides in the site']]],
['Analyst hub',['analyst','coach'],'<path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"/>',[['Overview','analyst summary'],['Scrims','results, bans, notes per player','scrims'],['Schedule','scrims, gamedays, off days','schedule'],['Stats','your team and opponents'],['Import','replays and scrims']]],
['Player hub',['player','coach'],'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>',[['Overview','your week at a glance'],['My Schedule','team schedule, add off days','schedule'],['Journal','goals with deadlines'],['My Stats','KOST, K/D, operators']]]];
function dashV(){
 if(!cur)return `<div class="cd"><h2 class="serif" style="font-size:28px">No team yet</h2><p class="mu">${staff()?'Create a team in Admin, or open one from the Teams list.':'Ask the owner to add you to a team.'}</p></div>`;
 const roles=viewing||(staff()&&!mem[cur.id])?ALL:(mem[cur.id]||[]);
 const badge=(staff()&&!mem[cur.id]?[me.site_role]:roles.map(r=>R[r])).join(', '),seen=new Set();
 return `<div class="row wrap" style="margin-bottom:24px;gap:14px">${tile(cur,48)}<h1 class="serif" style="font-size:34px;color:${esc(cur.color)}">${esc(cur.name)}</h1><span class="badge">${esc(badge)}</span></div>`+
 HUBS.filter(h=>h[1].some(r=>roles.includes(r))).map(h=>`<h2 class="hh">${h[0]}</h2><div class="g">${h[3].filter(c=>!c[2]||(!seen.has(c[2])&&seen.add(c[2]))).map(c=>`<button class="c" data-a="${c[2]||'soon'}"><span class="ic">${ico(h[2])}</span><span><b>${c[0]}</b><small>${c[1]}</small></span>${c[2]?'':'<span class="soon">Soon</span>'}</button>`).join('')}</div>`).join('');
}
const hasR=l=>staff()||(cur&&(mem[cur.id]||[]).some(r=>l.includes(r))),canSeeS=()=>hasR(['coach','assistant_coach','analyst']),canEditS=()=>hasR(['coach','assistant_coach','analyst']);
const toList=s=>s.split(',').map(x=>x.trim()).filter(Boolean),fact=(k,v)=>`<div><span class="mu">${k}</span><b>${esc(v)||'—'}</b></div>`;
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},fmtD=s=>new Date(s+'T00:00').toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
const sErr=e=>/schema cache|does not exist/i.test(e.message)?'The scrims database tables are not set up yet. Paste scrims.sql into the Supabase SQL Editor and run it.':e.code==='PGRST116'||/row-level security/i.test(e.message)?'You do not have permission to change scrims for this team.':e.message;
const curScrim=()=>(scr.list||[]).find(x=>x.id===scr.id);
const backDash=`<button class="no" data-a="sdash">Back to dashboard</button>`;
function scrimsV(){
 if(!cur||!scr||scr.tid!==cur.id)return `<div class="cd"><p>Open Scrims from a team's dashboard.</p><div>${backDash}</div></div>`;
 if(!canSeeS())return `<div class="cd"><p>Scrims are for this team's coaches, assistant coaches and analysts.</p><div>${backDash}</div></div>`;

}
function scrimList(){
 const ready=scr.list&&!scr.err,body=!scr.list?'<p class="mu">Loading scrims…</p>':scr.err?`<div class="cd"><p>${esc(scr.err)}</p></div>`:!scr.list.length?`<div class="cd"><p class="mu">No scrims yet.${canEditS()?' Add the first one.':''}</p></div>`:
 `<div style="display:flex;flex-direction:column;gap:10px">${scr.list.map(s=>`<button class="c" data-a="sopen" data-id="${s.id}"><span style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">vs ${esc(s.opponent)}</b><small>${fmtD(s.scrim_date)}${s.maps.length?' · '+esc(s.maps.join(', ')):''}</small></span>${s.score?`<span class="badge">${esc(s.score)}</span>`:''}${s.split?`<span class="mu">Split ${esc(s.split)}</span>`:''}</button>`).join('')}</div>`;
 return `<div class="row wrap" style="margin-bottom:20px">${tile(cur,48)}<div><h1 class="serif" style="font-size:34px">Scrims</h1><p class="mu">${esc(cur.name)}, newest first.</p></div><span class="sp"></span>${backDash}${ready&&canEditS()?'<button class="go" data-a="sform">Add scrim</button>':''}</div>${body}`;

function scrimForm(){
 const s=scr.id?curScrim():null,fld=(id,lab,val,ph='',att='')=>`<div><label for="${id}">${lab}</label><input id="${id}" class="fi" value="${esc(val)}" placeholder="${esc(ph)}" ${att}></div>`;
 return `<div class="row wrap" style="margin-bottom:20px"><h1 class="serif" style="font-size:34px">${s?'Edit scrim':'Add scrim'}</h1></div>
 <form class="cd" data-s="scrim" data-dirty style="max-width:720px">
 <div class="row wrap" style="gap:12px;align-items:flex-start"><div style="flex:1;min-width:200px"><label for="sfd">Date</label><input id="sfd" class="fi" type="date" required value="${esc(s?.scrim_date||today())}"></div><div style="flex:2;min-width:200px">${fld('sfo','Opponent',s?.opponent||'','Team name','required maxlength="120"')}</div></div>
 ${fld('sfm','Map(s), separated by commas',(s?.maps||[]).join(', '),'e.g. Clubhouse, Oregon')}
 <div class="row wrap" style="gap:12px;align-items:flex-start"><div style="flex:1;min-width:200px">${fld('sfu','Our bans, separated by commas',(s?.our_bans||[]).join(', '))}</div><div style="flex:1;min-width:200px">${fld('sft','Their bans, separated by commas',(s?.their_bans||[]).join(', '))}</div></div>

 <div class="row" style="justify-content:flex-end"><button type="button" class="no" data-a="scancel">Cancel</button><button class="go">${s?'Save changes':'Add scrim'}</button></div></form>`;

function scrimDetail(){
 const s=curScrim();if(!s)return scrimList();
 const can=canEditS(),ro=can?'':' readonly';
 const notes=scr.dErr?`<div class="cd"><p>${esc(scr.dErr)}</p></div>`:!scr.people?'<p class="mu">Loading notes…</p>':`<div style="display:flex;flex-direction:column;gap:16px" data-dirty>
 <div class="cd"><label for="sgen" style="font-size:15px;font-weight:600;color:var(--tx);margin:0">General notes</label><textarea id="sgen" class="fi ta"${ro}>${esc(s.notes)}</textarea></div>
 <div class="cd"><h2 style="font-size:15px;font-weight:600">Player notes</h2>${scr.people.length?scr.people.map(p=>`<div><label for="spn-${p.id}" class="row" style="gap:10px;color:var(--tx)"><span class="av">${esc(p.name[0].toUpperCase())}</span><span style="overflow-wrap:anywhere">${esc(p.name)}${p.former?' <span class="mu">(no longer a player on this team)</span>':''}</span></label><textarea id="spn-${p.id}" class="fi ta" data-p="${p.id}" aria-label="Notes for ${esc(p.name)}"${ro}>${esc(scr.notes[p.id]||'')}</textarea></div>`).join(''):'<p class="mu">This team has no one with the Player role yet. Add players in Manage Users.</p>'}</div>

 return `<div class="row wrap" style="margin-bottom:20px"><div style="flex:1 1 280px;min-width:0"><h1 class="serif" style="font-size:34px;overflow-wrap:anywhere">vs ${esc(s.opponent)}</h1><p class="mu">${fmtD(s.scrim_date)}</p></div><div class="row"><button class="no" data-a="sback">Back to scrims</button>${can?'<button class="no" data-a="sedit">Edit</button><button class="no" data-a="sdel">Delete</button>':''}</div></div>

async function fetchScrims(){
 const tid=scr.tid,r=await sb.from('scrims').select('*').eq('team_id',tid).order('scrim_date',{ascending:false}).order('created_at',{ascending:false});
 if(scr?.tid!==tid)return;
 scr.err=r.error?sErr(r.error):'';scr.list=r.data||[];
}
async function loadDetail(id){
 const tid=scr.tid,n=await sb.from('scrim_player_notes').select('user_id,notes').eq('scrim_id',id);
 if(scr?.id!==id)return;
 if(n.error){scr.dErr=sErr(n.error);return}
 const pl=allMem.filter(m=>m.team_id===tid&&m.roles.includes('player')).map(m=>m.user_id);
 const ids=[...new Set([...pl,...n.data.filter(x=>x.notes.trim()).map(x=>x.user_id)])];

async function saveScrim(form){
 const btn=form.querySelector('.go'),v=id=>$(id).value,row={scrim_date:v('#sfd'),opponent:v('#sfo').trim(),maps:toList(v('#sfm')),our_bans:toList(v('#sfu')),their_bans:toList(v('#sft')),score:v('#sfc').trim(),split:v('#sfp').trim(),notes:v('#sfn')};

 if(r.error)return toast(sErr(r.error));
 sdirty=false;await fetchScrims();await A.sopen({id:r.data.id});toast('Scrim saved');
}

 role:async d=>{const m=allMem.find(x=>x.team_id===d.t&&x.user_id===sel),roles=m.roles.includes(d.r)?m.roles.filter(x=>x!==d.r):[...m.roles,d.r];const r=await sb.from('team_members').upsert({team_id:d.t,user_id:sel,roles});r.error?toast(r.error.message):load()},
 rmteam:async d=>{const r=await sb.from('team_members').delete().match({team_id:d.t,user_id:sel});r.error?toast(r.error.message):load()},
 addteam:async()=>{const r=await sb.from('team_members').upsert({team_id:$('#addt').value,user_id:sel,roles:['player']});r.error?toast(r.error.message):load()},
 delinv:async d=>{await sb.from('invites').delete().eq('email',d.id);load()},
 color:(d,b)=>{cap();fm.color=d.c;document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#lp').innerHTML=tile({color:fm.color,name:fm.name||'?'},56)},
 prole:(d,b)=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'),
 addp:()=>{cap();fm.people.push({email:'',roles:['player']});$('#people').innerHTML=fm.people.map(prow).join('')},
 rmp:(d,b)=>{cap();const i=[...document.querySelectorAll('.pr')].indexOf(b.closest('.pr'));fm.people.splice(i,1);$('#people').innerHTML=fm.people.map(prow).join('')},
 mk:async()=>{cap();if(!fm.name.trim())return toast('Enter a team name');let logo_url=null;const f=$('#logo').files[0];
  if(f){const path=crypto.randomUUID()+'.'+(f.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,''),up=await sb.storage.from('logos').upload(path,f,{contentType:f.type});if(up.error)return toast(up.error.message);logo_url=sb.storage.from('logos').getPublicUrl(path).data.publicUrl}
  const{data:t,error}=await sb.from('teams').insert({name:fm.name.trim(),region:fm.region,league:fm.league.trim()||null,color:fm.color,logo_url}).select().single();if(error)return toast(error.message);
  for(const p of fm.people){const email=p.email.trim().toLowerCase();if(email&&p.roles.length){const r=await assign(email,t.id,p.roles);if(r.error)toast(email+': '+r.error.message)}}
  fm=null;view='teamsV';await load();toast('Team created')}
};
const LEAVE=new Set(['go','open','out','savename','sdash','sback','sform','sedit','scancel','sopen','schcancel']),leaveOk=()=>!sdirty||(confirm('You have unsaved changes. Leave without saving?')&&!(sdirty=false));
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]&&(!LEAVE.has(b.dataset.a)||leaveOk()))A[b.dataset.a](b.dataset,b)});
window.addEventListener('beforeunload',e=>{if(sdirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('input',e=>{if(e.target.closest('[data-dirty]'))sdirty=true;if(e.target.dataset.c==='filter'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-s]').forEach(x=>x.hidden=!x.dataset.s.includes(q))}});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(c==='sw'){if(!leaveOk()){e.target.value=cur.id;return}cur=teams.find(t=>t.id===e.target.value);viewing=false;if(view==='scrims')return A.scrims();if(view==='schedule')return A.schedule();render()}
 if(c==='shk'){const off=e.target.value==='off_day';$('#shgame').hidden=off;$('#shwrap').hidden=!off}
 if(c==='logo'&&e.target.files[0]){const u=URL.createObjectURL(e.target.files[0]);$('#lp').innerHTML=`<span class="lt" style="--s:56px;border-color:${esc(fm.color)}"><img src="${u}" alt=""></span>`}});
document.addEventListener('submit',async e=>{if(e.target.dataset.s==='scrim'){e.preventDefault();return saveScrim(e.target)}if(e.target.dataset.s==='sched'){e.preventDefault();return saveSch(e.target)}if(e.target.dataset.s!=='auth')return;e.preventDefault();
 const email=$('#em').value.trim(),password=$('#pw').value;
 if(mode==='in'){const{error}=await sb.auth.signInWithPassword({email,password});if(error)toast('Wrong email or password')}
 else{const{data,error}=await sb.auth.signUp({email,password});if(error)toast(/invited|Database error/i.test(error.message)?'This email has not been invited yet.':error.message);else if(!data.session)toast('Check your email to confirm, then sign in')}});
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'&&me&&s?.user?.id===me.id)return;if(['SIGNED_IN','SIGNED_OUT','INITIAL_SESSION'].includes(ev))setTimeout(load,0)});
</script>
</body>
</html>
