<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liv Analytics</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style id="app-css">
:root{--pk:#e07cc0;--bg:#0b0a0e;--cd:#131118;--bd:#231f2b;--bd2:#2a2532;--tx:#ece8f0;--mu:#9a93a6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(224,124,192,.09),transparent 70%),var(--bg);color:var(--tx);font:400 14px Inter,sans-serif;min-height:100vh}
h1,h2,h3,p{margin:0}button,input,select,textarea{font:inherit}
.serif{font-family:'Cormorant Garamond',serif;font-weight:600}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid #1d1923;flex-wrap:wrap}
header img{height:52px}header .brand{font-size:26px;letter-spacing:.02em}.sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:28px 24px}
.tb{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--bd2);background:var(--cd);color:var(--pk);font-weight:500;cursor:pointer}
.tb:hover,.no:hover,.ch:hover{border-color:var(--pk)}
.go{height:42px;padding:0 20px;border:0;border-radius:10px;background:var(--pk);color:#1a0b15;font-weight:600;cursor:pointer}.go:hover{background:#ea90cd;box-shadow:0 0 28px rgba(224,124,192,.35)}

.ch[aria-pressed=true]{border-color:var(--pk);background:rgba(224,124,192,.16);color:#f3c2e3}
.fi{width:100%;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--bd2);background:#0f0d13;color:var(--tx)}
.fi:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--pk);outline-offset:2px}
.ta{display:block;height:auto;min-height:110px;padding:10px 14px;line-height:1.5;resize:vertical}
input[type=date],input[type=time]{color-scheme:dark}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.facts b{display:block;margin-top:2px;font-weight:500;overflow-wrap:anywhere}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dow{font-size:12px;color:var(--mu);text-align:center;padding:4px 0}
.dc{min-width:0;min-height:104px;padding:6px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer}
.dc:hover{border-color:var(--pk)}.dc.out{opacity:.45}.dc[aria-current=date]{border-color:var(--pk);background:rgba(224,124,192,.12)}.dn{font-size:12px;font-weight:600}
.evs{display:flex;flex-direction:column;gap:3px;min-width:0}.ev{display:flex;align-items:center;gap:4px;font-size:11.5px;min-width:0}.ev i{width:3px;height:12px;border-radius:2px;flex:none}.ev span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.more{font-size:11px}
@media(max-width:640px){.dc{min-height:56px;padding:4px;align-items:center}.evs{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px}.ev span,.more{display:none}.ev i{width:8px;height:8px;border-radius:50%}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.over{color:#ff8a8a;font-size:13px;font-weight:600}
@media(max-width:640px){.tbl{font-size:12px}.tbl td,.tbl th{padding:8px 4px!important}.stat{padding:12px!important}.stat b{font-size:24px!important}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}.stat{padding:16px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}.stat b{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--mu);font-weight:500}.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
label,.lb{display:block;margin:0 0 6px;font-size:13px;color:#a59dad}
.cd{padding:22px;border-radius:16px;background:var(--cd);border:1px solid var(--bd);display:flex;flex-direction:column;gap:16px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{display:flex;gap:14px;align-items:center;padding:18px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);color:var(--tx);text-align:left;cursor:pointer;width:100%;transition:all .15s}
.c:hover{border-color:var(--pk);background:linear-gradient(135deg,rgba(224,124,192,.14),var(--cd) 70%);box-shadow:0 0 30px rgba(224,124,192,.18)}
.ic{width:42px;height:42px;border-radius:10px;border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;color:var(--pk);flex:none}
.c b{display:block;font-weight:600;font-size:15px}.c small{display:block;margin-top:3px;font-size:12.5px;color:var(--mu)}
.soon{margin-left:auto;font-size:11px;color:var(--mu);border:1px solid var(--bd2);border-radius:999px;padding:2px 8px}
h2.hh{font-size:15px;font-weight:600;margin:26px 0 12px}h2.hh:first-of-type{margin-top:0}
.lt{width:var(--s,36px);height:var(--s,36px);flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;overflow:hidden;border:1px solid}
.lt img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:12px}.wrap{flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}
.u{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid transparent;background:none;color:var(--tx);width:100%;text-align:left;cursor:pointer}
.u:hover{background:rgba(224,124,192,.08);border-color:#3a2a35}.u[aria-current=true]{background:rgba(224,124,192,.14);border-color:var(--pk)}
.av{width:38px;height:38px;border-radius:50%;background:#2a1d26;color:#f3c2e3;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.tr{padding:14px;border-radius:12px;border:1px solid var(--bd);background:#0f0d13;display:flex;flex-direction:column;gap:10px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tx)}
.two{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}.two2{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;align-items:start}
@media(max-width:820px){.two,.two2{grid-template-columns:1fr}}
.bar{background:rgba(224,124,192,.16);border-bottom:1px solid var(--pk);color:#f3c2e3;padding:10px 24px;display:flex;gap:12px;align-items:center}
.badge{padding:4px 10px;border-radius:999px;border:1px solid #3a2a35;color:var(--pk);font-size:12px;font-weight:600}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:30px}
.login img{width:280px;max-width:80%}.login .cd{width:100%;max-width:400px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1923;border:1px solid var(--pk);padding:12px 18px;border-radius:10px;display:none;z-index:9}
dialog{background:var(--cd);color:var(--tx);border:1px solid var(--bd2);border-radius:16px;padding:24px;width:min(420px,92vw)}dialog::backdrop{background:rgba(0,0,0,.6)}
.hm{display:flex;align-items:center;gap:12px;padding:0;border:0;border-radius:10px;background:none;color:inherit;cursor:pointer}
#upd{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--pk);color:#1a0b15;font-weight:600;cursor:pointer;box-shadow:0 6px 28px rgba(0,0,0,.5),0 0 24px rgba(224,124,192,.35);z-index:8}#upd:hover{background:#ea90cd}
body.upd main{padding-bottom:88px}body.upd #toast{bottom:72px}
[hidden]{display:none!important}
</style>
</head>

<script id="app-js">
const SUPABASE_URL='https://hyfycayfadqjhxucpfnm.supabase.co',SUPABASE_KEY='sb_publishable_91fUHDwka-sQOMN5A8J8CQ_KyfQVsc7';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const tile=(t,s=36)=>{const c=esc(t?.color||'#e07cc0');return `<span class="lt" style="--s:${s}px;color:${c};border-color:${c};background:${c}22">${t?.logo_url?`<img src="${esc(t.logo_url)}" alt="">`:esc((t?.name||'?').slice(0,2).toUpperCase())}</span>`};
async function load(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){me=null;view='dash';viewing=false;scr=null;sch=null;pl=null;ros=null;sdirty=false;return render()}

 cur=teams.find(x=>cur&&x.id===cur.id)||teams.find(x=>mem[x.id])||(staff()?null:teams[0])||null;

}
function render(){
 const a=$('#app');
 if(!me)return a.innerHTML=loginV();
 if(me.suspended)return a.innerHTML=`<div class="login"><div class="cd"><p>This account is suspended. Ask the owner for help.</p><button class="no" data-a="out">Sign out</button></div></div>`;

 ${viewing&&view==='dash'&&cur?`<div class="bar"><span>Viewing ${esc(cur.name)} as ${me.site_role}</span><button class="no" data-a="go" data-v="teamsV">Back to teams</button></div>`:''}
 <main>${({dash:dashV,admin:adminV,teamsV,users:usersV,create:createV,scrims:scrimsV,schedule:scheduleV,player:playerV,roster:rosterV})[view]()}</main>`;

function loginV(){return `<div class="login"><img src="logo.png" alt="Liv Analytics"><form class="cd" data-s="auth">
 <div><label for="em">Email</label><input id="em" class="fi" type="email" required autocomplete="email"></div>
 <div><label for="pw">Password</label><input id="pw" class="fi" type="password" required minlength="8" autocomplete="${mode==='in'?'current-password':'new-password'}"></div>

const HUBS=[['Scouting',['coach','assistant_coach','analyst'],'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',[['Scouting','teams by region and league'],['Match Library','all teams, every game'],['Round Library','all teams, every round'],['Vetoes','bans and picks per team'],['Export to Sheets','pick league and teams, then copy']]],

['Player Deck',['player'],'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>',[['Overview','your week at a glance','pover'],['My Schedule','team schedule, add off days','pmysch'],['Journal','goals with deadlines','pjournal'],['My Stats','KOST, K/D, operators','pstats']]]];
function dashV(){
 if(!cur)return `<div class="cd"><h2 class="serif" style="font-size:28px">No team yet</h2><p class="mu">${staff()?'Create a team in Admin, or open one from the Teams list.':'Ask the owner to add you to a team.'}</p></div>`;
 const roles=staff()?ALL:(mem[cur.id]||[]);

 return `<div class="row wrap" style="margin-bottom:24px;gap:14px">${tile(cur,48)}<h1 class="serif" style="font-size:34px;color:${esc(cur.color)}">${esc(cur.name)}</h1><span class="badge">${esc(badge)}</span>${staff()?'<button class="no" style="height:32px" data-a="tcolor">Team color</button>':''}</div>`+
 HUBS.filter(h=>h[1].some(r=>roles.includes(r))).map(h=>`<h2 class="hh">${h[0]}</h2><div class="g">${h[3].filter(c=>!c[2]||(!seen.has(c[2])&&seen.add(c[2]))).map(c=>`<button class="c" data-a="${c[2]||'soon'}"><span class="ic">${ico(h[2])}</span><span><b>${c[0]}</b><small>${c[1]}</small></span>${c[2]?'':'<span class="soon">Soon</span>'}</button>`).join('')}</div>`).join('');
}
const hasR=l=>staff()||(cur&&(mem[cur.id]||[]).some(r=>l.includes(r))),canSeeS=()=>hasR(['coach','assistant_coach','analyst']),canEditS=()=>hasR(['coach','assistant_coach','analyst']);
const toList=s=>s.split(',').map(x=>x.trim()).filter(Boolean),fact=(k,v)=>`<div><span class="mu">${k}</span><b>${esc(v)||'—'}</b></div>`;

function cap(){if(!$('#tn'))return;Object.assign(fm,{name:$('#tn').value,region:$('#rg').value,league:$('#lg').value});fm.people=[...document.querySelectorAll('.pr')].map(r=>({email:r.querySelector('.pe').value,roles:[...r.querySelectorAll('[aria-pressed=true]')].map(b=>b.dataset.r)}))}
async function assign(email,tid,roles){
 const pr=profs.find(x=>x.email.toLowerCase()===email);
 if(pr)return sb.from('team_members').upsert({team_id:tid,user_id:pr.id,roles});
 const inv=(await sb.from('invites').select('*').eq('email',email).maybeSingle()).data;
 return sb.from('invites').upsert({email,site_role:inv?.site_role||'member',assignments:(inv?.assignments||[]).filter(a=>a.team_id!==tid).concat([{team_id:tid,roles}])});
}
async function openSch(forUser,fromHub){view='schedule';sch={tid:cur.id,st:'list',list:null,err:'',id:null,names:{},members:[],players:[],cal:'month',anchor:today(),forUser,fromHub};render();if(!canSeeSch())return;await fetchSch();if(view==='schedule')render()}

 go:d=>{view=d.v;viewing=false;fm=view==='create'?fm:null;render()},
 soon:()=>toast('Coming in the next stage'),

 gdelyes:async(d,b)=>{b.disabled=true;const r=await sb.from('journal_goals').delete().eq('id',d.id).select();$('#dlg').close();if(r.error||!r.data.length)return toast(r.error?pErr(r.error):'You do not have permission to make that change.');await loadPlayer();render();toast('Goal deleted')},
 gndelyes:async(d,b)=>{b.disabled=true;const r=await sb.from('journal_notes').delete().eq('id',d.id).select();$('#dlg').close();if(r.error||!r.data.length)return toast(r.error?pErr(r.error):'You do not have permission to make that change.');await loadPlayer();render();toast('Note deleted')},
 tcolor:()=>{const d=$('#dlg');d.innerHTML=`<h2 class="serif" style="font-size:26px;margin-bottom:14px">Team color</h2><label for="hxd">Hex code</label><input id="hxd" class="fi" value="${esc(cur.color)}" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#e07cc0"><div class="row" style="margin-top:16px"><button class="go" data-a="tcolorsave">Save</button><button class="no" data-a="close">Cancel</button></div>`;d.showModal()},
 tcolorsave:async(d,b)=>{const c=normHex($('#hxd').value);if(!c)return toast('Enter a hex code like #e07cc0');b.disabled=true;const r=await sb.from('teams').update({color:c}).eq('id',cur.id).select().single();b.disabled=false;if(r.error)return toast(r.error.code==='PGRST116'?'You do not have permission to make that change.':r.error.message);Object.assign(cur,r.data);$('#dlg').close();render();toast('Team color saved')},
 schcal:d=>{sch.cal=d.v;render()},
 schnav:d=>{const n=+d.n,t=today();if(sch.cal==='month'){const a=new Date(+sch.anchor.slice(0,4),+sch.anchor.slice(5,7)-1+n,1),ym=a.getFullYear()+'-'+String(a.getMonth()+1).padStart(2,'0');sch.anchor=ym===t.slice(0,7)?t:ym+'-01'}else sch.anchor=addD(sch.anchor,sch.cal==='week'?7*n:n);render()},
 schtoday:()=>{sch.anchor=today();render()},
 schday:d=>{sch.anchor=d.d;sch.cal='day';render()},
 schadd:()=>{sch.st='form';sch.id=null;render()},
 schedit:d=>{sch.st='form';sch.id=d.id;render()},
 schcancel:()=>{sch.st='list';sch.id=null;render()},
 schdel:d=>{const e=sch.list.find(x=>x.id===d.id),g=$('#dlg');sch.delId=d.id;g.innerHTML=`<h2 class="serif" style="font-size:26px;margin-bottom:10px">Delete this entry?</h2><p class="mu" style="overflow-wrap:anywhere">This permanently removes "${esc(e.title)}" from the schedule.</p><div class="row" style="margin-top:16px"><button class="go" data-a="schdelyes">Delete entry</button><button class="no" data-a="close">Cancel</button></div>`;g.showModal()},
 schdelyes:async(d,b)=>{b.disabled=true;const r=await sb.from('schedule_entries').delete().eq('id',sch.delId).select();$('#dlg').close();if(r.error||!r.data.length)return toast(r.error?schE(r.error):'You do not have permission to make that change.');await fetchSch();render();toast('Entry deleted')},
 sdash:()=>{view='dash';render()},
 sback:()=>{scr.st='list';scr.id=null;render()},
 sform:()=>{scr.st='form';scr.id=null;render()},
 sedit:()=>{scr.st='form';render()},
 scancel:()=>{scr.st=scr.id?'detail':'list';render()},
 sopen:async d=>{Object.assign(scr,{st:'detail',id:d.id,people:null,notes:{},dErr:''});render();await loadDetail(d.id);if(view==='scrims'&&scr?.st==='detail'&&scr.id===d.id)render()},
 snotes:async(d,b)=>{const s=curScrim(),gen=$('#sgen').value,rows=[...document.querySelectorAll('[data-p]')].filter(t=>t.value!==(scr.notes[t.dataset.p]||'')).map(t=>({scrim_id:s.id,team_id:scr.tid,user_id:t.dataset.p,notes:t.value}));
  b.disabled=true;
  if(gen!==s.notes){const r=await sb.from('scrims').update({notes:gen}).eq('id',s.id).select().single();if(r.error){b.disabled=false;return toast(sErr(r.error))}s.notes=gen}
  if(rows.length){const r=await sb.from('scrim_player_notes').upsert(rows);if(r.error){b.disabled=false;return toast(sErr(r.error))}rows.forEach(x=>scr.notes[x.user_id]=x.notes)}
  b.disabled=false;sdirty=false;toast('Notes saved')},
 sdel:()=>{const s=curScrim(),d=$('#dlg');d.innerHTML=`<h2 class="serif" style="font-size:26px;margin-bottom:10px">Delete this scrim?</h2><p class="mu" style="overflow-wrap:anywhere">This permanently removes the scrim against ${esc(s.opponent)} and all of its notes.</p><div class="row" style="margin-top:16px"><button class="go" data-a="sdelyes">Delete scrim</button><button class="no" data-a="close">Cancel</button></div>`;d.showModal()},
 sdelyes:async(d,b)=>{b.disabled=true;const r=await sb.from('scrims').delete().eq('id',scr.id).select();$('#dlg').close();if(r.error||!r.data.length)return toast(r.error?sErr(r.error):'You do not have permission to change scrims for this team.');sdirty=false;scr.st='list';scr.id=null;await fetchScrims();render();toast('Scrim deleted')},
 out:()=>sb.auth.signOut(),
 mode:()=>{mode=mode==='in'?'up':'in';render()},
 open:d=>{cur=teams.find(t=>t.id===d.id);viewing=true;view='dash';render()},
 pick:d=>{sel=d.id;render()},
 settings:()=>{const d=$('#dlg');d.innerHTML=`<h2 class="serif" style="font-size:26px;margin-bottom:14px">Settings</h2><label for="dn">Display name</label><input id="dn" class="fi" value="${esc(me.display_name||'')}"><div class="row" style="margin-top:16px"><button class="go" data-a="savename">Save</button><button class="no" data-a="out">Sign out</button><button class="no" data-a="close">Close</button></div>`;d.showModal()},
 profile:()=>{const d=$('#dlg');d.innerHTML=`<h2 class="serif" style="font-size:26px;margin-bottom:10px">${esc(me.display_name||me.email)}</h2><p class="mu">${esc(me.email)}</p><p style="margin:12px 0">Site role: ${me.site_role}</p>${teams.filter(t=>mem[t.id]).map(t=>`<p>${esc(t.name)}: ${mem[t.id].map(r=>R[r]).join(', ')||'no role'}</p>`).join('')}<button class="no" style="margin-top:16px" data-a="close">Close</button>`;d.showModal()},
 close:()=>$('#dlg').close(),
 savename:async()=>{const r=await sb.rpc('update_my_name',{n:$('#dn').value});r.error?toast(r.error.message):(toast('Saved'),$('#dlg').close(),load())},
 srole:async d=>{const r=await sb.rpc('set_site_role',{target:sel,new_role:d.r});r.error?toast(r.error.message):load()},
 susp:async()=>{const u=profs.find(p=>p.id===sel);const r=await sb.rpc('set_suspended',{target:sel,flag:!u.suspended});r.error?toast(r.error.message):load()},
 role:async d=>{const m=allMem.find(x=>x.team_id===d.t&&x.user_id===sel),roles=m.roles.includes(d.r)?m.roles.filter(x=>x!==d.r):[...m.roles,d.r];const r=await sb.from('team_members').upsert({team_id:d.t,user_id:sel,roles});r.error?toast(r.error.message):load()},
 rmteam:async d=>{const r=await sb.from('team_members').delete().match({team_id:d.t,user_id:sel});r.error?toast(r.error.message):load()},
 addteam:async()=>{const r=await sb.from('team_members').upsert({team_id:$('#addt').value,user_id:sel,roles:['player']});r.error?toast(r.error.message):load()},
 delinv:async d=>{await sb.from('invites').delete().eq('email',d.id);load()},
 color:(d,b)=>{cap();fm.color=d.c;$('#hx').value=d.c;document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#lp').innerHTML=tile({color:fm.color,name:fm.name||'?'},56)},
 prole:(d,b)=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'),
 addp:()=>{cap();fm.people.push({email:'',roles:['player']});$('#people').innerHTML=fm.people.map(prow).join('')},

 mk:async()=>{cap();if(!fm.name.trim())return toast('Enter a team name');const hex=normHex($('#hx').value);if(!hex)return toast('Enter a hex code like #e07cc0');fm.color=hex;let logo_url=null;const f=$('#logo').files[0];
  if(f){const path=crypto.randomUUID()+'.'+(f.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,''),up=await sb.storage.from('logos').upload(path,f,{contentType:f.type});if(up.error)return toast(up.error.message);logo_url=sb.storage.from('logos').getPublicUrl(path).data.publicUrl}
  const{data:t,error}=await sb.from('teams').insert({name:fm.name.trim(),region:fm.region,league:fm.league.trim()||null,color:fm.color,logo_url}).select().single();if(error)return toast(error.message);
  for(const p of fm.people){const email=p.email.trim().toLowerCase();if(email&&p.roles.length){const r=await assign(email,t.id,p.roles);if(r.error)toast(email+': '+r.error.message)}}
  fm=null;view='teamsV';await load();toast('Team created')}
};
const LEAVE=new Set(['go','open','out','savename','sdash','sback','sform','sedit','scancel','sopen','schcancel','updnow','schedule','pmysch','pover','pjournal','pstats','pnotes','phub','phopen','gform','gedit','gcancel','gnoteopen','gnotecancel']),leaveOk=()=>!sdirty||(confirm('You have unsaved changes. Leave without saving?')&&!(sdirty=false));
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]&&(!LEAVE.has(b.dataset.a)||leaveOk()))A[b.dataset.a](b.dataset,b)});
window.addEventListener('beforeunload',e=>{if(sdirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('input',e=>{if(e.target.closest('[data-dirty]'))sdirty=true;if(e.target.dataset.c==='hex'){const v=normHex(e.target.value);if(v){fm.color=v;document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===v));$('#lp').innerHTML=tile({color:v,name:$('#tn').value||'?'},56)}}if(e.target.dataset.c==='filter'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-s]').forEach(x=>x.hidden=!x.dataset.s.includes(q))}});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(c==='sw'){if(!leaveOk()){e.target.value=cur.id;return}cur=teams.find(t=>t.id===e.target.value);viewing=false;if(view==='scrims')return A.scrims();if(view==='schedule')return openSch(sch?.forUser===me.id?me.id:'',false);if(view==='player')return openPlayer(pl.page);if(view==='roster')return openRoster();render()}
 if(c==='schfor'){sch.forUser=e.target.value;render()}
 if(c==='plfor'){if(!leaveOk()){e.target.value=pl.uid;return}pl.uid=e.target.value;openPlayer(pl.page)}
 if(c==='gstat'){const g=pl.goals.find(x=>x.id===e.target.dataset.id);if(!leaveOk()){e.target.value=g.status;return}sb.from('journal_goals').update({status:e.target.value}).eq('id',g.id).select().single().then(async r=>{if(r.error){toast(pErr(r.error));e.target.value=g.status;return}Object.assign(pl,{form:null,noteFor:null});await loadPlayer();render()})}
 if(c==='shk')$('#shgame').hidden=!['scrim','gameday'].includes(e.target.value);
 if(c==='logo'&&e.target.files[0]){const u=URL.createObjectURL(e.target.files[0]);$('#lp').innerHTML=`<span class="lt" style="--s:56px;border-color:${esc(fm.color)}"><img src="${u}" alt=""></span>`}});
document.addEventListener('submit',async e=>{if(e.target.dataset.s==='scrim'){e.preventDefault();return saveScrim(e.target)}if(e.target.dataset.s==='sched'){e.preventDefault();return saveSch(e.target)}if(e.target.dataset.s==='goal'){e.preventDefault();return saveGoal(e.target)}if(e.target.dataset.s==='gnote'){e.preventDefault();return saveNote(e.target)}if(e.target.dataset.s!=='auth')return;e.preventDefault();
 const email=$('#em').value.trim(),password=$('#pw').value;
 if(mode==='in'){const{error}=await sb.auth.signInWithPassword({email,password});if(error)toast('Wrong email or password')}
 else{const{data,error}=await sb.auth.signUp({email,password});if(error)toast(/invited|Database error/i.test(error.message)?'This email has not been invited yet.':error.message);else if(!data.session)toast('Check your email to confirm, then sign in')}});
const pageSig=d=>['#app-css','#app-js'].map(s=>d.querySelector(s)?.textContent).join('\n');
async function checkUpdate(){
 if(document.hidden||!$('#upd').hidden)return;
 try{const r=await fetch(location.pathname,{cache:'no-store'});if(!r.ok)return;
  const n=new DOMParser().parseFromString(await r.text(),'text/html');
  if(!n.querySelector('#app-js')||pageSig(n)===pageSig(document))return;
  $('#upd').hidden=false;document.body.classList.add('upd')}catch{}
}
setInterval(checkUpdate,12e4);setTimeout(checkUpdate,5e3);document.addEventListener('visibilitychange',checkUpdate);
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'&&me&&s?.user?.id===me.id)return;if(['SIGNED_IN','SIGNED_OUT','INITIAL_SESSION'].includes(ev))setTimeout(load,0)});
